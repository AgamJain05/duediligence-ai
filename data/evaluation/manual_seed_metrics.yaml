# =============================================================================
# manual_seed_metrics.yaml  (Phase 6)
# Curated, version-controlled metric facts for the NexaCore / QuantumEdge corpus.
# Extraction is deterministic: NO LLM is used to produce these rows.
#
# SEED IS AUTHORITATIVE FOR:
#   (a) prose-only facts (letters, MD&A text, risk text, call remarks)
#   (b) tables the generic TABLE_PARSE step must SKIP:
#         - Outlook / guidance tables
#         - quarterly (Q4) tables
#         - market-share tables
#         - multi-company comparison tables (QE FY2024 financial table, Meridian tables)
#         - product spec / product notes tables
# ALL OTHER TABLES (income-statement style, segment, region, balance sheet) are
# handled by TABLE_PARSE and must NOT be duplicated here (uniqueness collisions).
#
# KEY LEGEND (per-entry):
#   m=metric_name  fy=fiscal_year  p=fiscal_period (FY|Q1..Q4|CY)  v=value
#   u=unit (USD|PERCENT|USD_PER_SHARE|COUNT|MULTIPLE|MONTHS)
#   s=scale (UNITS|THOUSANDS|MILLIONS|BILLIONS)
#   dt=dimension_type  dv=dimension_value  q=qualifier  co=company override
#   sec=section path   txt=source_text (original wording, for traceability)
#
# QUALIFIER VALUES (see schema note in the chat reply):
#   REPORTED | ANALYST_ADJUSTED | ESTIMATE | GUIDANCE_LOW | GUIDANCE_HIGH |
#   FORECAST_LOW | FORECAST_HIGH | TARGET | UPPER_BOUND | LOWER_BOUND
# AUTHORITY VALUES: PRIMARY_FILING | EARNINGS_CALL | THIRD_PARTY
# Extra dimension_type values used here: ACQUISITION, CUSTOMER, CUSTOMER_GROUP,
#   PRODUCT, SUPPLIER, MARKET, SCENARIO, PROJECT, LITIGATION
# =============================================================================
version: 1
defaults: {p: FY, q: REPORTED, s: UNITS}

documents:

